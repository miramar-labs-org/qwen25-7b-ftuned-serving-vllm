runtime:
  kind: vllm-direct

model:
  base_model_id: "Qwen/Qwen2.5-7B-Instruct"
  served_model_name: "qwen25-arc"   # stable alias exposed to clients

adapter:
  ft_project: "qwen25-7b-arc-ft-eval-pipeline"
  max_lora_rank: 16

vllm:
  dtype: bfloat16
  gpu_memory_utilization: 0.80
  max_model_len: 2048
  port: 8000

deployment:
  namespace: "qwen25-7b-ftuned-serving-vllm"
  gpu_type: gb10
  gpu_count: 1
